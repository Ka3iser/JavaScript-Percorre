<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intro JS</title>
</head>
<body>
    <h1>Primeira aula</h1>

    <button onclick="clicar()">
        CLICA EM MIM!!!
    </button>
    <!-- linkar o js no final do body -->
    <script>
        console.log("Ola mundo!"); /* mostrar uma mensagem do navegador */
        // o JavaScript é uma linguagem case sensitive (difere entre maiuscula e minuscula)

        // window.alert("The GOAT");
        // window.prompt("Digite sua senha: ");
        // alert("O GOAT está logado");

        function clicar(){
            alert("Obrigado :D");
        }

        // alguns testes

        /* preciso mostrar os numeros 1 2 3 no console */

        console.log(1);
        console.log(2);
        console.log(3);

        // tipos de dados

        // String é um conjunto de caracteres = ""
        // Number significa que é numero 

        console.clear();
        console.log("5 + 5");
        console.log(5 + 5);

        console.log(5 + 5);
        console.log(5 - 5);
        console.log(5 * 5);
        console.log(5 / 5);

    </script>
</body>
</html>
