<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h1>NuBank</h1>
    <div class="buttons">
        <button onclick="picpay()">PicPay</button>
        <button onclick="nubank()">Nubank</button>
    </div>


    <script>
        function picpay(){
            document.body.style.backgroundColor = "#21C25E";
            document.body.style.fontFamily = "arial";
            
        }

        function nubank() {
            document.body.style.backgroundColor = "#820AD1";
            document.body.style.fontFamily = "Times New Roman";
        }
    </script>
</body>
</html>
